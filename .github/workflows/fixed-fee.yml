name: VMESH fixed fee policy tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: VMESH 1% output, tamper and serialization tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python tools
        run: python -m py_compile coordinator/vmesh_template_builder.py submitter/vmesh-submit compat/auxrpc.py
